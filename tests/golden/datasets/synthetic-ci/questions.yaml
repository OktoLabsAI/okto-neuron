# Golden dataset questions - synthetic-ci (deterministic CI eval gate)
#
# Consumed by the DETERMINISTIC-ONLY gate: provenance byte-hash + hard recall@k
# + extraction-completeness. No LLM judge required for this set.
#
# Schema per question:
#   id:               stable identifier
#   category:         one of point_in_time | timeline | quantitative |
#                     entity_resolution | supersedence | multi_hop |
#                     simple_lookup | negative_control
#   tier:             T1 | T2 | T3   (T1 single-fact, T2 single-doc synthesis,
#                     T3 multi-doc / multi-hop)
#   question:         natural-language query
#   expected_answer:  gold answer text
#   must_contain:     substrings that MUST appear in a correct answer
#   gold_targets:     [{source_path, quote, quote_hash, node_id}] - quote is a
#                     VERBATIM substring of source_path that contains/supports the
#                     answer. Hard recall@k requires the gold_targets' files to be
#                     retrieved.
#                     quote_hash = "sha256:" + sha256(located quote bytes); the
#                     SAME byte hash judge.py's gold-span self-check verifies
#                     (sha256(file_bytes[byte_start:byte_end])) and equal to the
#                     floor's freshly-computed content_hash, so the optional
#                     quote_hash self-check actively validates these targets.
#                     node_id = the covering Claim node id in
#                     frozen-vault/graph.lbug (resolved by recall_floor.py's
#                     extraction leg), or null when no single Claim covers the
#                     quote in the frozen vault.
#   distractors:      [{source_path, quote}] - near-duplicate, similar-but-WRONG
#                     passages a naive matcher could retrieve instead. Verbatim.
#   negative_control: true => answer is absent; system must decline, not invent.
#
# Every gold/distractor quote is a verbatim substring of its file (grep -F
# verified, 0 mismatches). Fully synthetic world; safe to commit.

