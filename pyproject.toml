[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "okto-neuron"
version = "0.3.0"
description = "Okto Neuron: local-first knowledge graph memory for agents, with cited sources and an MCP server."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Elastic License 2.0 + SaaS/Branding Addendum" }
authors = [{ name = "Okto Labs", email = "dev@oktolabs.ai" }]
keywords = ["knowledge-graph", "mcp", "local-first", "librarianship", "embeddings"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3.12",
  "Topic :: Text Processing :: Indexing",
]
dependencies = [
  "pydantic>=2.6,<3",
  "email-validator>=2,<3",
  "pyyaml>=6.0,<7",
  "click>=8.1,<9",
  "packaging>=24,<27",
  "markdown-it-py>=3.0,<5",
  "httpx>=0.27,<0.29",
  "jsonschema>=4.0,<5",
  "okto-grafx>=0.0.4,<0.1",
  "ladybug>=0.18.2,<0.19",  # required by the IndexStore engine, not only the grafx graph backend (D-88)
]

[project.urls]
Homepage = "https://oktolabs.ai/platform/neuron/"
Source = "https://github.com/OktoLabsAI/okto-neuron"
Documentation = "https://github.com/OktoLabsAI/okto-neuron#readme"
Changelog = "https://github.com/OktoLabsAI/okto-neuron/releases"
Issues = "https://github.com/OktoLabsAI/okto-neuron/issues"

[project.optional-dependencies]
embeddings = ["fastembed==0.8.0", "numpy>=1.26,<3"]  # fastembed pinned exact for eval reproducibility
ladybug    = ["ladybug>=0.18.2,<0.19"]
grafx      = ["okto-grafx>=0.0.4,<0.1", "ladybug>=0.18.2,<0.19"]  # default index engine needs ladybug too (D-88)
neo4j      = ["neo4j>=6,<7", "ladybug>=0.18.2,<0.19"]  # default index engine needs ladybug too (D-88)
jsonld     = ["rdflib>=7,<8"]
mcp        = ["ladybug>=0.18.2,<0.19", "fastmcp>=3.3,<3.4", "starlette>=0.40,<2", "uvicorn>=0.30,<1", "fastembed==0.8.0", "numpy>=1.26,<3"]  # compatibility alias for the complete server boundary
serve      = ["ladybug>=0.18.2,<0.19", "fastmcp>=3.3,<3.4", "starlette>=0.40,<2", "uvicorn>=0.30,<1", "fastembed==0.8.0", "numpy>=1.26,<3"]
litellm    = ["litellm>=1.89.7,<1.90"]  # 1.90.0-1.102.0 (latest at time of writing) break the
                                          # chatgpt provider: "Unknown items in responses API
                                          # response: []" in every call, bisected 2026-09-22 to
                                          # completion_extras/litellm_responses_transformation
                                          # (63 commits churned there since 1.87). 1.89.7 is the
                                          # newest release confirmed working end to end.
telemetry  = ["mlflow>=3.16,<4"]  # optional GenAI tracing export; never a hard runtime dep (see docs/observability.md)
bedrock    = ["litellm>=1.89.7,<1.90", "boto3>=1.43,<2"]
sentence-transformers = ["sentence-transformers>=5.6,<6"]
dev        = ["pytest>=8,<10", "pytest-asyncio>=0.23,<2", "ruff>=0.5,<1", "hypothesis>=6,<7", "psutil>=5.9,<8", "httpx2>=2,<3"]

# PEP-735 dependency groups — the uv-native runner contract. `uv run okto-neuron
# serve` auto-syncs these, so the blessed bring-up Just Works without naming
# extras. The published `serve` extra and uv-native `serve` group both close the
# complete app-server dependency boundary. `mcp` retains the same complete
# closure as a compatibility alias for earlier install guidance. Lower-level
# `ladybug` and `embeddings` extras remain available to library consumers.
# `dev`'s uv group carries one intentional extra entry beyond its published
# extra: `stub-backend-pkg`, a repo-relative `[tool.uv.sources]` path
# dependency (M3 §2.11) that exists only to prove third-party graph-backend
# resolution in tests. It is deliberately NOT mirrored into
# `[project.optional-dependencies].dev` — that extra ships in the published
# wheel's metadata, and a path-only requirement would fail to resolve for any
# external `pip install okto-neuron[dev]` user. See
# test_uv_groups_match_their_published_extras' documented exception.
[dependency-groups]
serve   = ["ladybug>=0.18.2,<0.19", "fastmcp>=3.3,<3.4", "starlette>=0.40,<2", "uvicorn>=0.30,<1", "fastembed==0.8.0", "numpy>=1.26,<3"]
jsonld  = ["rdflib>=7,<8"]
litellm = ["litellm>=1.89.7,<1.90"]
telemetry = ["mlflow>=3.16,<4"]
bedrock = ["litellm>=1.89.7,<1.90", "boto3>=1.43,<2"]
sentence-transformers = ["sentence-transformers>=5.6,<6"]
dev     = ["pytest>=8,<10", "pytest-asyncio>=0.23,<2", "ruff>=0.5,<1", "hypothesis>=6,<7", "psutil>=5.9,<8", "httpx2>=2,<3", "stub-backend-pkg==0.0.1"]

[tool.uv]
# Synced by default on every `uv run`. `dev` MUST stay listed or `uv run pytest`
# / `uv run ruff` lose their deps.
default-groups = ["serve", "dev"]

[tool.uv.sources]
# tests/fixtures/stub_backend_pkg is a real, separately-installable package
# (own pyproject.toml, its own "marginalia.graph_backends" entry point, the
# pre-0.3.0 group name, which is still read) used
# by the registry contract suite to prove third-party backend resolution
# without any in-tree import (M3 §2.11). Editable so edits under
# tests/fixtures/stub_backend_pkg/ take effect without a re-sync.
stub-backend-pkg = { path = "tests/fixtures/stub_backend_pkg", editable = true }

[project.scripts]
okto-neuron = "okto_neuron.cli:app"
kg = "okto_neuron.cli:kg_cli"
# Pre-0.3.0 command name: same commands, prints a rename warning. Removed in 0.5.
marginalia = "okto_neuron.cli:legacy_app"

# Empty on purpose (M3 §2.10): `_OFFICIAL` in store/registry.py and
# store/index/registry.py resolves the in-tree "ladybug"/default backends
# directly, without going through entry points. These groups exist only so
# `entry_points(group=...)` has a group to select from instead of erroring
# on one that was never declared; third-party backends (e.g.
# tests/fixtures/stub_backend_pkg, pulled in via [tool.uv.sources] below)
# register into them. Both the 0.3.0 `okto_neuron.*` groups and the pre-0.3.0
# `marginalia.*` groups are read (okto_neuron/_compat.py); the new group wins
# on a name clash.
[project.entry-points."okto_neuron.graph_backends"]

[project.entry-points."okto_neuron.index_backends"]

[project.entry-points."marginalia.graph_backends"]

[project.entry-points."marginalia.index_backends"]

[tool.hatch.build.targets.wheel]
packages = ["src/okto_neuron"]

# Ship the built web UI as package data. The frontend (track #4) emits to the
# repo-root `frontend_dist/` (vite outDir); we map it into the package tree at
# `okto_neuron/_webui` so `pip install` users get the UI. NOTE: force-include
# only populates the built wheel — `pip install -e` does NOT create
# `okto_neuron/_webui` in the source tree, so the runtime resolver
# (`server/http.py::_webui_dir`) also falls back to repo-root `frontend_dist/`.
# Absent build = no dir = API-only mode (CLI/MCP unaffected).
[tool.hatch.build.targets.wheel.force-include]
"frontend_dist" = "okto_neuron/_webui"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "acceptance_synthetic: MVP acceptance gate run against synthetic vault fixture (CI-safe)",
  "acceptance_private_corpus: opt-in acceptance gate for an external private corpus (laptop-only, never CI)",
  "acceptance_judge: ADR 0010 Tier B real-judge band gate against the live LLM backend (laptop-only, never CI); auto-skipped in the default selection — run explicitly with -m acceptance_judge",
  "eval: recall/ask quality eval over the fixed synthetic vault (CI-safe, deterministic, no LLM)",
  "realmodel: full quality bar against an explicitly configured real OpenAI-compatible endpoint + exact 27B NVFP4 model + fastembed; laptop-only, also tagged slow so the default suite deselects it",
  "slow: long-running tests excluded from default local workflows when explicitly skipped",
  "perf: performance regression checks",
  "footprint: install size / disk footprint checks; opt-in",
]

[tool.coverage.run]
source = ["okto_neuron.core.schema"]
